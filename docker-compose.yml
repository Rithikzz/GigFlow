version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:6.0-jammy
    container_name: gigflow_db
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - gigflow_network

  # Node.js Express Backend API Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gigflow_api
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb+srv://sankarrithik5_db_user:KFGmOp6brI5WLbqb@gigflow.jobnefm.mongodb.net/gigflow?retryWrites=true&w=majority
      - JWT_SECRET=prod_secret_fallback_for_docker_compose_security_keys_13579
      - CLIENT_URL=http://localhost:8080
    depends_on:
      - mongodb
    networks:
      - gigflow_network

  # React Frontend Dashboard Service
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5001/api/v1
    container_name: gigflow_web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - gigflow_network

volumes:
  mongodb_data:
    driver: local

networks:
  gigflow_network:
    driver: bridge
